        app.component('range-filter', {
            props: {
                minValue: {
                    type: Number,
                    required: true
                },
                maxValue: {
                    type: Number,
                    required: true
                },
                name: {
                    type: String,
                    default: 'Range Filter'
                }
            },
            emits: ['update:apply', 'update:range'],
            data() {
                return {
                    apply: false,
                    range: {
                        min: this.minValue,
                        max: this.maxValue
                    },
                    error: ''
                };
            },
            watch: {
                apply(val) {
                    this.$emit('update:apply', val);
                },
                range: {
                    handler(val) {
                        this.validateRange(val);
                    },
                    deep: true
                }
            },
            methods: {
                validateRange(val) {
                    if (val.min < this.minValue || val.max > this.maxValue) {
                        this.error = `Values must be between ${this.minValue} and ${this.maxValue}.`;
                    } else if (val.max <= val.min) {
                        this.error = `Max must be greater than Min.`;
                    } else {
                        this.error = '';
                        this.$emit('update:range', val);
                    }
                }
            },
            template: `
                <div style="padding: 6px 10px; font-size: 13px; display: flex; flex-direction: column; gap: 10px;">

                <!-- Checkbox -->
                <div style="display: flex; align-items: center; justify-content: space-between;">
                    <span style="font-weight: bold;">{{ name }}</span>
                    <helper color="#000">
                        <template v-slot:default>
                          
                        </template>
                    </helper>
                </div>
                <div style="display: flex; align-items: center; gap: 8px;">
                   
                    <input type="checkbox" id="applyFilter" v-model="apply">
                    <label for="applyFilter" style="margin: 0;">Apply Filter</label>
                </div>

                <!-- Range inputs -->
                <div style="display: flex; justify-content: space-between; align-items: center; gap: 10px;">
                    <label for="min" style="min-width: 40px;">Min:</label>
                    <input type="number" id="min" v-model.number="range.min" :min="minValue" :max="maxValue" step="1"
                    style="flex: 1; padding: 2px; border: 1px solid #ccc; border-radius: 4px;">

                    <label for="max" style="min-width: 40px;">Max:</label>
                    <input type="number" id="max" v-model.number="range.max" :min="minValue" :max="maxValue" step="1"
                    style="flex: 1; padding: 4px; border: 1px solid #ccc; border-radius: 4px;">
                </div>

                <!-- Error message -->
                <div v-if="error" style="color: red; font-size: 12px; margin-top: 4px;">
                    {{ error }}
                </div>
                </div>
            `
        });


        app.component('category-filter', {
            props: {
                candidates: {
                    type: Array,
                    required: true
                },
                name: {
                    type: String,
                    default: 'Category Filter'
                }
            },
            emits: ['update:apply', 'update:selected'],
            data() {
                return {
                    apply: false,
                    selected: [],
                    error: '',
                    page: 1,
                    perPage: 10
                };
            },
            computed: {
                totalPages() {
                    return Math.ceil(this.candidates.length / this.perPage);
                },
                paginatedCandidates() {
                    const start = (this.page - 1) * this.perPage;
                    return this.candidates.slice(start, start + this.perPage);
                }
            },
            watch: {
                selected(val) {
                    this.validate();
                    this.$emit('update:selected', val);
                },
                apply(val) {
                    this.validate();
                    this.$emit('update:apply', val);
                }
            },
            methods: {
                validate() {
                    if (this.apply && this.selected.length === 0) {
                        this.error = '⚠️ You must select at least one category to apply the filter.';
                    } else {
                        this.error = '';
                    }
                },
                nextPage() {
                    if (this.page < this.totalPages) this.page++;
                },
                prevPage() {
                    if (this.page > 1) this.page--;
                },
                clear_all() {
                    this.selected = [];
                    this.apply = false;
                    this.error = '';
                }
            },
            template: `
    <div style="padding: 6px 10px; font-size: 13px; display: flex; flex-direction: column; gap: 10px; margin-top:4px; border-top: 1px solid #ccc; border-radius: 4px; background-color: #f7f5f5;">

      <!-- Title and help -->
      <div style="display: flex; align-items: center; justify-content: space-between;">
        <span style="font-weight: bold;">{{ name }}</span>
        <helper color="#000">
          <template v-slot:default>
            
          </template>
        </helper>
      </div>

      <!-- Apply checkbox -->
      <div style="display: flex; align-items: center; gap: 8px;">
        <input type="checkbox" id="applyFilter" v-model="apply">
        <label for="applyFilter" style="margin: 0;">Apply Filter</label>
      </div>

      <div style="display: flex; justify-content: flex-end;">
        <button @click="clear_all" style="font-size: 12px; padding: 2px 6px;">Clear All</button>
      </div>
      <!-- Error -->
      <div v-if="error" style="color: red; font-size: 12px; margin-top: 4px;">
        {{ error }}
      </div>
      <!-- Category options with pagination -->
      <div style="max-height: 200px; overflow-y: auto; border: 1px solid #ccc; padding: 4px; border-radius: 4px;background-color: #fff;">
        <label v-for="option in paginatedCandidates" :key="option" style="display: flex; align-items: center; gap: 6px; margin-bottom: 4px;">
          <input type="checkbox" :value="option" v-model="selected">
          {{ option }}
        </label>
      </div>

      <!-- Pagination controls -->
      <div v-if="totalPages > 1" style="display: flex; justify-content: space-between; align-items: center; margin-top: 4px;">
        <button @click="prevPage" :disabled="page === 1"> Prev</button>
        <span>Page {{ page }} / {{ totalPages }}</span>
        <button @click="nextPage" :disabled="page === totalPages">Next </button>
      </div>


    </div>
  `
        });


        app.component("help-popup", {
            data() {
                return {
                    visible: false
                };
            },
            methods: {
                toggleHelp() {
                    this.visible = !this.visible;
                }
            },
            template: `
    <div style="position: relative;">
      <button @click="toggleHelp"
        style="background-color: #FFA726; color: white; border: none; padding: 6px 12px; font-size: 13px; border-radius: 4px; cursor: pointer;">
        Help
      </button>

      <div v-if="visible" style="
        position: absolute;
        bottom: 120%;
        right: 0;
        width: 90vw;
        max-height: 80vh;
        overflow-y: auto;
        background: white;
        color: black;
        border: 2px solid #FFA726;
        border-radius: 8px;
        padding: 16px;
        z-index: 1000;
        box-shadow: 0 4px 8px rgba(0,0,0,0.2);
      ">
        <div style="display: flex; justify-content: space-between; align-items: center;">
          <h3 style="margin: 0;">Omni2TreeView Help</h3>
          <button @click="toggleHelp" style="background-color: #FB8C00;">Close</button>
        </div>
        <hr />
<div>
  <h2>Omni2TreeView Overview</h2>

  <p>
    Omni2TreeView is an interactive tree viewer for exploring node structure, sample composition, and metadata patterns in one page.
  </p>

  <h3>Page Layout</h3>
  <ul>
    <li><strong>Top Bar:</strong> Chooses the main palette and up to three extra palettes used to color the tree.</li>
    <li><strong>Left Panel:</strong> Contains tree summary, tree size controls, node size controls, and filter modules.</li>
    <li><strong>Center Tree View:</strong> Shows the interactive tree and supports zooming, panning, and node selection.</li>
    <li><strong>Right Panel:</strong> Shows details for the currently selected node.</li>
  </ul>

  <h3>Main Modules</h3>
  <ul>
    <li><strong>Palette Controls:</strong> Let you decide which metadata drives the main node colors and the extra corner colors on leaf nodes.</li>
    <li><strong>Tree Information:</strong> Summarizes the dataset, including tree name, node counts, sample counts, and available metadata fields.</li>
    <li><strong>Adjust Tree:</strong> Lets you change canvas width and height, and also rescale node sizes with a factor plus min and max size limits.</li>
    <li><strong>Tree Filters:</strong> Lets you restrict what is emphasized in the tree using confidence ranges and metadata-based filters.</li>
    <li><strong>Node Details:</strong> Shows basic information, composition summary, and sample-level details for the selected node.</li>
  </ul>

  <h3>How To Read The Tree</h3>
  <ul>
    <li><strong>Leaf nodes:</strong> Display as small squares whose colored regions reflect the selected palettes.</li>
    <li><strong>Internal nodes:</strong> Display as pie-chart circles summarizing the composition of descendant samples.</li>
    <li><strong>Selected or highlighted content:</strong> Is emphasized so you can focus on one node or subtree at a time.</li>
  </ul>

  <h3>Common Interactions</h3>
  <ul>
    <li><strong>Change palettes:</strong> Update how metadata is mapped to node colors.</li>
    <li><strong>Adjust tree or node size:</strong> Redraw the tree for a layout that is easier to inspect.</li>
    <li><strong>Apply filters:</strong> Narrow the visible result to the ranges or categories you care about.</li>
    <li><strong>Click a node:</strong> Inspect its metadata, descendants, and sample table in the right panel.</li>
    <li><strong>Zoom and pan:</strong> Move around large trees more comfortably.</li>
  </ul>
</div>

      </div>
    </div>
  `
        });



        app.mount("#app");

    </script>

</body>

</html>
